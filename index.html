<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bugvert 2.5 · smart unit & price converter</title>
<link rel="icon" href="images/bugvert.jpg" type="image/jpeg">
<meta name="color-scheme" content="light dark">
<script>try{var t=(JSON.parse(localStorage.getItem('bugvert2.settings')||'{}')||{}).theme||'system';document.documentElement.dataset.theme=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="app-header">
<button id="brand" class="brand" aria-label="bugvert home"><img src="images/bugvert.jpg" alt="" class="brand-icon"><span class="brand-name">bugvert<sup>2.5</sup></span></button>
<div id="file-slot"></div>
<div id="dir-slot"></div>
<span class="grow"></span>
<button id="theme-btn" class="icon-btn theme-btn" aria-label="Theme" title="Theme"></button>
<div id="hist" class="hist hidden">
<button id="undo-btn" class="icon-btn" aria-label="Undo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
<button id="redo-btn" class="icon-btn" aria-label="Redo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
</div>
<button id="new-btn" class="btn ghost hidden">New file</button>
<button id="export-cta" class="btn primary hidden"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>Export</button>
</header>
<main id="view"></main>
<nav id="dock" role="tablist" aria-label="Sections"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-input" accept=".xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt" hidden>
<script src="js/xlsx.full.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/logic.js"></script>
<script src="js/ui.js"></script>
<script src="js/state.js"></script>
<script src="js/app.js"></script>
<script src="js/sheet.js"></script>
<script src="js/views.js"></script>
<script src="js/export.js"></script>
<script>App.boot();</script>
</body>
</html>
